<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <link rel="stylesheet" href="css/global.css">

    <style>
        body {
            background: black;
            margin: 0;
            overflow: hidden;
        }

        /* 중앙 정렬 */
        #loading-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 로딩 이미지 */
        .loading-icon {
            width: 220px;
            animation: pulse 1.8s infinite ease-in-out;
        }

        /* 맥동 애니메이션 */
        @keyframes pulse {
            0%   { transform: scale(1);   opacity: 0.6; }
            50%  { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1);   opacity: 0.6; }
        }

        /* 화면 전체 페이드인 */
        .fade-in {
            animation: fadeIn 1.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>

<body class="fade-in">

    <div id="loading-container">
        <img src="assets/loading.png" class="loading-icon" alt="Loading">
    </div>

    <!-- Background Music -->
    <audio id="bgm" src="assets/cute.mp3" loop></audio>

    <script>
        const bgm = document.getElementById("bgm");
        bgm.volume = 0;

        function startAudio() {
            bgm.play().catch(() => {});
            let volume = 0;

            const fadeIn = setInterval(() => {
                volume += 0.02;
                bgm.volume = Math.min(volume, 1);
                if (volume >= 1) clearInterval(fadeIn);
            }, 50);

            document.removeEventListener("click", startAudio);
            document.removeEventListener("touchstart", startAudio);
        }

        document.addEventListener("click", startAudio);
        document.addEventListener("touchstart", startAudio);

        // 3초 후 userps.html 로 이동
        setTimeout(() => {
            window.location.href = "userps.html";
        }, 3000);
    </script>

</body>
</html>
