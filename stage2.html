<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Stage 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle&display=swap" rel="stylesheet">

<style>
.dongle-regular {
    font-family: "Dongle", sans-serif;
    font-weight: 400;
    font-style: normal;
}

body {
    margin: 0;
    padding: 0;
    background-image: url("assets/mini_bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: dongle;
}

.stage2-wrapper {
    position: relative;
    width: 1600px;
    height: 1000px;
    margin: 0 auto;
}

.stage-bg {
    width: 100%;
    position: absolute;
    top: 10px;
    left: 0;
    z-index: 1;
}

.section {
    position: absolute;
    width: 100px;
    height: 100px;
    z-index: 5;
}

input.real-input {
    opacity: 0;
    position: absolute;
    width: 200px;
    pointer-events: auto;
    border: none;
    outline: none;
}

.fake-text {
    position: absolute;
    width: 200px;
    font-size: 25px;
    display: flex;
    align-items: center;
    user-select: none;
    pointer-events: none;
}

.caret {
    width: 2px;
    height: 1em;
    background: #ef8ec7;
    margin-left: 3px;
    animation: blink 0.7s steps(1) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

.submit-btn {
    width: 70px;
    height: 30px;
    opacity: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    position: absolute;
}

.doubt {
    color:#ef8ec7;
    font-size:25px;
    width: 250px;
    line-height: 0.9;
    position: absolute;
}

.hint {
    color:#ef8ec7;
    font-size:25px;
    width:350px;
    line-height:0.9;
    position:absolute;
}

.hidden { display:none; }

.crazy {
    animation: crazyShake 0.4s infinite,
               crazyPulse 1s infinite alternate,
               crazyGlow 1.2s infinite alternate;
}

@keyframes crazyShake {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(3deg); }
    50% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
}

@keyframes crazyPulse {
    0% { font-size: 15px; }
    100% { font-size: 25px; }
}

@keyframes crazyGlow {
    0% { text-shadow: 0 0 4px #ff6bff; }
    100% { text-shadow: 0 0 12px #ff00ea, 0 0 20px #ff73ff; }
}

.fade-out { animation: fadeOut 0.7s forwards; }
@keyframes fadeOut { to { opacity:0; } }

/* ANSWER BUBBLE */
.answer-bubble {
    position: absolute;
    color:#ef8ec7;
    font-size:25px;
    width:350px;
    line-height:0.9;
    pointer-events:none;
    animation: popIn 0.3s ease-out forwards;
}

@keyframes popIn {
    from { opacity:0; transform:scale(0.9); }
    to   { opacity:1; transform:scale(1); }
}

#q1fake .text { color:#81619f; }
#q1fake .caret { background:#81619f; }
#q2fake .text { color:#f572be; }
#q2fake .caret { background:#f572be; }
#q3fake .text { color:#628ecc; }
#q3fake .caret { background:#628ecc; }
</style>
</head>

<body>
<div class="stage2-wrapper">
<img src="assets/stage2bg.png" class="stage-bg">

<!-- Q1 -->
<div class="section" id="q1" style="top:250px; left:350px;">
<p id="q1doubt" class="doubt" style="top:-22px; left:440px;">어서 빨리 알려줘!<br>기다리고 있단 말이야!</p>
<div id="q1fake" class="fake-text" style="top:0px; left:120px;">
<span class="text" id="q1text"></span><span class="caret"></span>
</div>
<input id="q1input" class="real-input" style="top:17px; left:120px;">
<button id="q1btn" class="submit-btn" style="top:65px; left:140px;"></button>
<p id="q1hint" class="hint" style="top:160px; left:700px;">네가 뭘 좋아하는지<br>너무 궁금해!</p>
</div>

<!-- Q2 -->
<div class="section hidden" id="q2" style="top:480px; left:350px;">
<p id="q2doubt" class="doubt" style="top:-250px; left:440px;">어서 빨리 알려줘!<br>기다리고 있단 말이야!</p>
<div id="q2fake" class="fake-text" style="top:-38px; left:120px;">
<span class="text" id="q2text"></span><span class="caret"></span>
</div>
<input id="q2input" class="real-input" style="top:-30px; left:120px;">
<button id="q2btn" class="submit-btn" style="top:35px; left:140px;"></button>
<p id="q2hint" class="hint" style="top:-74px; left:700px;">네가 뭘 좋아하는지<br>너무 궁금해!</p>
</div>

<!-- Q3 -->
<div class="section hidden" id="q3" style="top:710px; left:350px;">
<p id="q3doubt" class="doubt dongle-regular" style="top:-480px; left:440px;">어서 빨리 알려줘!<br>기다리고 있단 말이야!</p>
<div id="q3fake" class="fake-text" style="top:-76px; left:120px;">
<span class="text" id="q3text"></span><span class="caret"></span>
</div>
<input id="q3input" class="real-input" style="top:-60px; left:120px;">
<button id="q3btn" class="submit-btn" style="top:-10px; left:140px;"></button>
<p id="q3hint" class="hint" style="top:-300px; left:700px;">네가 뭘 좋아하는지<br>너무 궁금해!</p>
</div>

<audio id="wrongSound" src="assets/wrong.mp3"></audio>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const wrongSound = document.getElementById("wrongSound");

function bindFake(inputId,fakeId){
    const input=document.getElementById(inputId);
    const t=document.querySelector(`#${fakeId} .text`);
    input.addEventListener("input",()=>t.textContent=input.value);
    document.getElementById(fakeId).addEventListener("click",()=>input.focus());
}

bindFake("q1input","q1fake");
bindFake("q2input","q2fake");
bindFake("q3input","q3fake");

const attempts={q1:0,q2:0,q3:0};

const hintsMap={
    q1:[["앞글자는 ‘두’. 디저트","느낌 나는 단어야!"],["‘두바이’와 관련 있어.","도시 이름이 들어가!"],["쫀득쫀득한 식감…","이제 정말 다 왔어."],["거의 다 왔어!","두바이쫀득쿠키!"]],
    q2:[["‘로’로 시작해.","라면 느낌 나는 음식이야."],["매운 라면 계열.","불닭 계열!"],["불닭 + 납작당면.","힌트 거의 다 줬다…"],["마지막 힌트!","로제불닭납작당면!"]],
    q3:[["걸그룹 노래.","요즘 뜨는 팀!"],["그룹명은 아일릿!","귀엽지 않다고 주장해."],["‘낫 큐트’ 느낌.","거의 다 왔어."],["마지막 힌트!","아일릿의 ‘낫 큐트’!"]]
};

const answerBubblePosition={q1:{top:"-22px",left:"440px"},q2:{top:"-250px",left:"440px"},q3:{top:"-480px",left:"440px"}};
const answerBubbleText={q1:"정답이야!",q2:"맞아.",q3:"정답."};

function spawnAnswerBubble(key){
    const bubble=document.createElement("p");
    bubble.className="answer-bubble crazy";
    bubble.innerHTML=answerBubbleText[key];
    bubble.style.top=answerBubblePosition[key].top;
    bubble.style.left=answerBubblePosition[key].left;
    document.getElementById(key).appendChild(bubble);
    setTimeout(()=>{bubble.classList.add("fade-out");setTimeout(()=>bubble.remove(),700);},2500);
}

const answers=["두바이쫀득쿠키","로제불닭납작당면","아일릿의 낫 큐트"];

function autoWrite(span,text,input){
    span.textContent="";
    let i=0;
    const chars=[...text];
    (function type(){
        if(i<chars.length){
            span.textContent+=chars[i++];
            setTimeout(type,200);
        }
    })();
    input.value=text;
}

function handleQuestion(key,inputEl,correct,nextStep){
    const doubtEl=document.getElementById(key+"doubt");
    const hintEl=document.getElementById(key+"hint");
    const value=inputEl.value.trim();
    if(!value)return;

    if(value===correct){
        doubtEl.classList.add("hidden");
        hintEl.innerHTML="정답! 😆<br>너 정말 잘 맞췄다!";
        hintEl.classList.remove("hidden");
        hintEl.classList.add("crazy");
        spawnAnswerBubble(key);
        setTimeout(()=>{hintEl.classList.add("hidden");nextStep&&nextStep();},3000);
        return;
    }

    wrongSound.currentTime=0;
    wrongSound.play();
    attempts[key]++;

    if(attempts[key]===5){
        autoWrite(document.getElementById(key+"text"),correct,inputEl);
    }

    const[h1,h2]=hintsMap[key][Math.min(attempts[key]-1,hintsMap[key].length-1)];
    doubtEl.innerHTML="그게 맞아…?<br>다시 생각해봐.";
    hintEl.innerHTML=`${h1}<br>${h2}`;
    doubtEl.classList.remove("hidden");
    hintEl.classList.remove("hidden");
}

q1btn.onclick=()=>handleQuestion("q1",q1input,answers[0],()=>q2.classList.remove("hidden"));
q2btn.onclick=()=>handleQuestion("q2",q2input,answers[1],()=>q3.classList.remove("hidden"));
q3btn.onclick=()=>handleQuestion("q3",q3input,answers[2],()=>{document.body.classList.add("fade-out");setTimeout(()=>location.href="stage3.html",700);});

});
</script>
</body>
</html>
