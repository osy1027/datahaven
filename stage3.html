<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>클래식 미로 탈출 게임</title>

<style>
body {
  margin: 0;
  padding: 0;
  background-image: url("./assets/mini_bg.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  font-family: system-ui, sans-serif;
  overflow: hidden;
}

.stage2-wrapper {
  position: relative;
  width: 1600px;
  height: 1000px;
  margin: 0 auto;
}

.stage-bg {
  position: absolute;
  top: 10px;
  left: 0;
  width: 100%;
  z-index: 1;
}

.maze-wrapper {
  position: absolute;
  top: 325px;
  left: 50%;
  transform: translateX(-50%) scale(1.25);
  transform-origin: top center;
  z-index: 2;
}

#game {
  border: transparent;
  image-rendering: pixelated;
}

/* ===== CHEER TEXT ===== */
.cheer-text {
  position: absolute;
  z-index: 3;
  color: #ff67c0;
  font-size: 25px;
  font-family: dongle;
  font-weight: 400;
  background: transparent;
  padding: 10px 16px;
  text-align: center;
  line-height: 0.9;
  user-select: none;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="stage2-wrapper">
  <img src="./assets/layoutmaze.png" class="stage-bg" id="stageBg">
  <div class="cheer-text" id="cheerText"></div>
  <div class="maze-wrapper">
    <canvas id="game"></canvas>
  </div>
</div>

<audio id="bgm" src="./assets/cute.mp3" loop muted></audio>

<script>
const __bgm = document.getElementById("bgm");
document.addEventListener("click", () => {
  __bgm.currentTime = 40;
  __bgm.muted = false;
  __bgm.play();
}, { once: true });
</script>

<script>
/* ===== SIZE ===== */
const tileSize = 20;
const playerSize = 42;
const hitboxSize = 12;
const guardW = 100;
const guardH = 100;
const fakeExitSize = 30;
const realExitSize = 30;

/* ===== COLORS ===== */
const wallColor  = "#ff9ef8";
const wallStroke = "#e293c4";
const floorColor = "#d150b3";

/* ===== IMAGES ===== */
const playerImg = new Image();
playerImg.src = "./assets/star.png";

const guardImg = new Image();
guardImg.src = "./assets/faceicon2p.png";

const realExitImg = new Image();
realExitImg.src = "./assets/square.png";

const fakeExitImages = [
  "./assets/circle.png",
  "./assets/triangle.png",
  "./assets/polygon.png",
  "./assets/square.png"
].map(src => {
  const img = new Image();
  img.src = src;
  return img;
});

/* ===== MAZE MAP ===== */
const maze = [
  "#####################",
  "#S....#............E#",
  "###.#.#.####.#.#####.#",
  "#...#.#.#....#.....#.#",
  "#.###.#.#.########.#.#",
  "#.#...#.#....#.....#.#",
  "#.#.###.####.#.#####.#",
  "#.#.#.....#..#.......#",
  "#.#.#.###.#.###.#.###.#",
  "#.#.#.#.#.#.....#.#E.#",
  "#.#.#.#.#.#######.#.#.#",
  "#.#.#.#.#.......#...#.#",
  "#E#.#.#.#########.#.#.#",
  "#.....#.......#...#.#.#",
  "###.#.#######.#.###.#.#",
  "#...#.......#.#.....R.#",
  "#####################"
];

const rows = maze.length;
const cols = maze[0].length;

/* ===== CANVAS ===== */
const canvas = document.getElementById("game");
canvas.width = cols * tileSize;
canvas.height = rows * tileSize;
const ctx = canvas.getContext("2d");

/* ===== GAME STATE ===== */
let player = { x: 0, y: 0 };
let start = { x: 0, y: 0 };
const fakeExits = [];
let realExit = null;
const guards = [];

/* ===== PARSE MAP ===== */
for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    const ch = maze[r][c];
    const cx = (c + 0.5) * tileSize;
    const cy = (r + 0.5) * tileSize;

    if (ch === "S") {
      player.x = cx;
      player.y = cy;
      start.x = cx;
      start.y = cy;
    } else if (ch === "E") {
      fakeExits.push({ cx, cy });
    } else if (ch === "R") {
      realExit = { cx, cy };
    }
  }
}

fakeExits.forEach(ex => {
  guards.push({
    exit: ex,
    active: false,
    x: ex.cx - tileSize,
    y: ex.cy,
    width: tileSize * 0.75,
    height: tileSize * 0.55,
    minX: ex.cx - tileSize,
    maxX: ex.cx + tileSize,
    dir: 1,
    speed: 1.2,
    triggerRadius: tileSize * 4
  });
});

/* ===== INPUT ===== */
const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function isWall(px, py) {
  const c = Math.floor(px / tileSize);
  const r = Math.floor(py / tileSize);
  if (c < 0 || c >= cols || r < 0 || r >= rows) return true;
  return maze[r][c] === "#";
}

/* ===== UPDATE / DRAW / LOOP ===== */
let flickerFrame = 0;
let playerVisible = true;

function update() {
  const speed = 1.3;
  let vx = (keys.a || keys.ArrowLeft ? -1 : 0) + (keys.d || keys.ArrowRight ? 1 : 0);
  let vy = (keys.w || keys.ArrowUp ? -1 : 0) + (keys.s || keys.ArrowDown ? 1 : 0);

  if (vx || vy) {
    flickerFrame++;
    if (flickerFrame % 6 === 0) playerVisible = !playerVisible;
  } else {
    flickerFrame = 0;
    playerVisible = true;
  }

  if (vx && vy) {
    vx *= Math.SQRT1_2;
    vy *= Math.SQRT1_2;
  }

  const prevX = player.x;
  const prevY = player.y;
  const half = hitboxSize / 2;

  const nx = player.x + vx * speed;
  if (!isWall(nx - half, player.y - half) &&
      !isWall(nx + half, player.y - half) &&
      !isWall(nx - half, player.y + half) &&
      !isWall(nx + half, player.y + half)) {
    player.x = nx;
  }

  const ny = player.y + vy * speed;
  if (!isWall(player.x - half, ny - half) &&
      !isWall(player.x + half, ny - half) &&
      !isWall(player.x - half, ny + half) &&
      !isWall(player.x + half, ny + half)) {
    player.y = ny;
  }

  guards.forEach(g => {
    const d = Math.hypot(player.x - g.exit.cx, player.y - g.exit.cy);
    if (!g.active && d < g.triggerRadius) g.active = true;
    if (g.active) {
      g.x += g.dir * g.speed;
      if (g.x < g.minX || g.x > g.maxX) g.dir *= -1;
    }
  });

  guards.forEach(g => {
    if (!g.active) return;
    if (
      player.x + half > g.x &&
      player.x - half < g.x + g.width &&
      player.y + half > g.y &&
      player.y - half < g.y + g.height
    ) {
      player.x = prevX;
      player.y = prevY;
    }
  });

  fakeExits.forEach(ex => {
    if (Math.hypot(player.x - ex.cx, player.y - ex.cy) < tileSize * 0.35) {
      alert("가짜 출구입니다! 다시 시작합니다.");
      player.x = start.x;
      player.y = start.y;
    }
  });

  if (realExit &&
      Math.hypot(player.x - realExit.cx, player.y - realExit.cy) < tileSize * 0.35) {
    alert("탈출 성공!");
    window.location.href = "./stage4.html";
  }
}

function drawMaze() {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * tileSize;
      const y = r * tileSize;
      ctx.fillStyle = maze[r][c] === "#" ? "#ff9ef8" : "#d150b3";
      ctx.fillRect(x, y, tileSize, tileSize);
      if (maze[r][c] === "#") {
        ctx.strokeStyle = "#e293c4";
        ctx.strokeRect(x, y, tileSize, tileSize);
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMaze();

  fakeExits.forEach((ex, i) => {
    ctx.drawImage(fakeExitImages[i % fakeExitImages.length],
      ex.cx - fakeExitSize / 2,
      ex.cy - fakeExitSize / 2,
      fakeExitSize, fakeExitSize);
  });

  if (realExit) {
    ctx.drawImage(realExitImg,
      realExit.cx - realExitSize / 2,
      realExit.cy - realExitSize / 2,
      realExitSize, realExitSize);
  }

  guards.forEach(g => {
    if (g.active) {
      ctx.drawImage(guardImg,
        g.x + (g.width - guardW) / 2,
        g.y + (g.height - guardH) / 2,
        guardW, guardH);
    }
  });

  if (playerVisible) {
    ctx.drawImage(playerImg,
      player.x - playerSize / 2,
      player.y - playerSize / 2,
      playerSize, playerSize);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

/* ===== BACKGROUND TOGGLE ===== */
const bgImages = ["./assets/layoutmaze.png", "./assets/layoutmaze2.png"];
let bgIndex = 0;
const stageBg = document.getElementById("stageBg");
setInterval(() => {
  bgIndex = (bgIndex + 1) % bgImages.length;
  stageBg.src = bgImages[bgIndex];
}, 1000);

/* ===== CHEER TEXT ===== */
const cheerData = [
  { text: "미로를 탈출해봐!", top: "210px", right: "610px" },
  { text: "너 맘대로 해!", top: "210px", right: "620px" },
  { text: "진짜 출구를 찾아봐!", top: "210px", right: "600px" },
  { text: "틀린 출구는 없어!", top: "210px", right: "610px" },
  { text: "넌 할 수 있어!", top: "210px", right: "613px" }
];

let cheerIndex = 0;
const cheerText = document.getElementById("cheerText");

function formatCheerText(text) {
  const limit = 15;
  if (text.length <= limit) return text;
  const mid = Math.ceil(text.length / 2);
  return text.slice(0, mid) + "<br>" + text.slice(mid);
}

function updateCheer() {
  const data = cheerData[cheerIndex];
  cheerText.innerHTML = formatCheerText(data.text);
  cheerText.style.top = data.top;
  cheerText.style.right = data.right;
}

updateCheer();
setInterval(() => {
  cheerIndex = (cheerIndex + 1) % cheerData.length;
  updateCheer();
}, 5000);
</script>

</body>
</html>
