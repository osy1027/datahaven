<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>클래식 미로 탈출 게임</title>

<style>
body {
  margin: 0;
  padding: 0;
  background-image: url("assets/mini_bg.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  font-family: system-ui, sans-serif;
}

.stage2-wrapper {
  position: relative;
  width: 1600px;
  height: 1000px;
  margin: 0 auto;
}

.stage-bg {
  position: absolute;
  top: 10px;
  left: 0;
  width: 100%;
  z-index: 1;
}

.maze-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1.35);
  transform-origin: center center;
  z-index: 2;
}

#game {
  border: 2px solid #eee;
  image-rendering: pixelated;
}
</style>
</head>

<body>

<div class="stage2-wrapper">
  <img src="/assets/layoutmaze.png" class="stage-bg">
  <div class="maze-wrapper">
    <canvas id="game"></canvas>
  </div>
</div>

<script>
/* ===== SIZE ===== */
const tileSize = 20;
const playerSize = 42;
const hitboxSize = 12;
const guardW = 24;
const guardH = 24;
const fakeExitSize = 30;
const realExitSize = 30;

/* ===== COLORS ===== */
const wallColor  = "#ef8ec7";
const wallStroke = "#ffddff";
const floorColor = "#c979aa";

/* ===== IMAGES ===== */
const playerImg = new Image();
playerImg.src = "/assets/star.png";

const guardImg = new Image();
guardImg.src = "/assets/faceiconp.png";

const realExitImg = new Image();
realExitImg.src = "/assets/square.png";

const fakeExitImages = [
  "/assets/circle.png",
  "/assets/triangle.png",
  "/assets/polygon.png",
  "/assets/square.png"
].map(src => {
  const i = new Image();
  i.src = src;
  return i;
});

const fakeExitOffsets = [
  { x: -2, y: -1 },
  { x: 19, y: -1 },
  { x: 2,  y: 17 },
  { x: 17,  y: -20 }
];
const realExitOffset = { x: 1, y: 0 };

/* ===== MAZE MAP ===== */
const maze = [
  "#####################",
  "#S....#............E#",
  "###.#.#.####.#.#####.#",
  "#...#.#.#....#.....#.#",
  "#.###.#.#.########.#.#",
  "#.#...#.#....#.....#.#",
  "#.#.###.####.#.#####.#",
  "#.#.#.....#..#.......#",
  "#.#.#.###.#.###.#.###.#",
  "#.#.#.#.#.#.....#.#E.#",
  "#.#.#.#.#.#######.#.#.#",
  "#.#.#.#.#.......#...#.#",
  "#E#.#.#.#########.#.#.#",
  "#.....#.......#...#.#.#",
  "###.#.#######.#.###.#.#",
  "#...#.......#.#.....R.#",
  "#####################"
];

const rows = maze.length;
const cols = maze[0].length;

/* ===== CANVAS ===== */
const canvas = document.getElementById("game");
canvas.width = cols * tileSize;
canvas.height = rows * tileSize;
const ctx = canvas.getContext("2d");

/* ===== GAME STATE ===== */
let player = { x: 0, y: 0 };
let start = { x: 0, y: 0 };
const fakeExits = [];
let realExit = null;
const guards = [];

/* ===== PARSE MAP ===== */
for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    const ch = maze[r][c];
    const cx = (c + 0.5) * tileSize;
    const cy = (r + 0.5) * tileSize;

    if (ch === "S") {
      player.x = cx;
      player.y = cy;
      start.x = cx;
      start.y = cy;
    } else if (ch === "E") {
      fakeExits.push({ cx, cy });
    } else if (ch === "R") {
      realExit = { cx, cy };
    }
  }
}

/* ===== GUARDS ===== */
fakeExits.forEach(ex => {
  guards.push({
    exit: ex,
    active: false,
    x: ex.cx - tileSize,
    y: ex.cy,
    width: tileSize * 0.75,
    height: tileSize * 0.55,
    minX: ex.cx - tileSize,
    maxX: ex.cx + tileSize,
    dir: 1,
    speed: 1.2,
    triggerRadius: tileSize * 4
  });
});

/* ===== INPUT ===== */
const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function isWall(px, py) {
  const c = Math.floor(px / tileSize);
  const r = Math.floor(py / tileSize);
  if (c < 0 || c >= cols || r < 0 || r >= rows) return true;
  return maze[r][c] === "#";
}

/* ===== UPDATE ===== */
let flickerFrame = 0;
let playerVisible = true;

function update() {
  const speed = 1.3;
  let vx = (keys.a || keys.ArrowLeft ? -1 : 0) + (keys.d || keys.ArrowRight ? 1 : 0);
  let vy = (keys.w || keys.ArrowUp ? -1 : 0) + (keys.s || keys.ArrowDown ? 1 : 0);

  if (vx || vy) {
    flickerFrame++;
    if (flickerFrame % 6 === 0) playerVisible = !playerVisible;
  } else {
    flickerFrame = 0;
    playerVisible = true;
  }

  if (vx && vy) {
    vx *= Math.SQRT1_2;
    vy *= Math.SQRT1_2;
  }

  const prevX = player.x;
  const prevY = player.y;
  const half = hitboxSize / 2;

  const nx = player.x + vx * speed;
  if (!isWall(nx - half, player.y - half) &&
      !isWall(nx + half, player.y - half) &&
      !isWall(nx - half, player.y + half) &&
      !isWall(nx + half, player.y + half)) {
    player.x = nx;
  }

  const ny = player.y + vy * speed;
  if (!isWall(player.x - half, ny - half) &&
      !isWall(player.x + half, ny - half) &&
      !isWall(player.x - half, ny + half) &&
      !isWall(player.x + half, ny + half)) {
    player.y = ny;
  }

  guards.forEach(g => {
    const d = Math.hypot(player.x - g.exit.cx, player.y - g.exit.cy);
    if (!g.active && d < g.triggerRadius) g.active = true;
    if (g.active) {
      g.x += g.dir * g.speed;
      if (g.x < g.minX || g.x > g.maxX) g.dir *= -1;
    }
  });

  guards.forEach(g => {
    if (!g.active) return;
    if (
      player.x + half > g.x &&
      player.x - half < g.x + g.width &&
      player.y + half > g.y &&
      player.y - half < g.y + g.height
    ) {
      player.x = prevX;
      player.y = prevY;
    }
  });

  fakeExits.forEach(ex => {
    if (Math.hypot(player.x - ex.cx, player.y - ex.cy) < tileSize * 0.35) {
      alert("가짜 출구입니다! 다시 시작합니다.");
      player.x = start.x;
      player.y = start.y;
    }
  });

  /* ===== SUCCESS → STAGE 4 ===== */
  if (realExit &&
      Math.hypot(player.x - realExit.cx, player.y - realExit.cy) < tileSize * 0.35) {
    alert("탈출 성공!");
    window.location.href = "stage4.html";
  }
}

/* ===== DRAW ===== */
function drawMaze() {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * tileSize;
      const y = r * tileSize;
      if (maze[r][c] === "#") {
        ctx.fillStyle = wallColor;
        ctx.fillRect(x, y, tileSize, tileSize);
        ctx.strokeStyle = wallStroke;
        ctx.strokeRect(x, y, tileSize, tileSize);
      } else {
        ctx.fillStyle = floorColor;
        ctx.fillRect(x, y, tileSize, tileSize);
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMaze();

  let eIndex = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * tileSize;
      const y = r * tileSize;
      if (maze[r][c] === "E") {
        const img = fakeExitImages[eIndex % fakeExitImages.length];
        const off = fakeExitOffsets[eIndex % fakeExitOffsets.length];
        ctx.drawImage(img,
          x + (tileSize - fakeExitSize) / 2 + off.x,
          y + (tileSize - fakeExitSize) / 2 + off.y,
          fakeExitSize, fakeExitSize);
        eIndex++;
      }
      if (maze[r][c] === "R") {
        ctx.drawImage(realExitImg,
          x + (tileSize - realExitSize) / 2 + realExitOffset.x,
          y + (tileSize - realExitSize) / 2 + realExitOffset.y,
          realExitSize, realExitSize);
      }
    }
  }

  guards.forEach(g => {
    if (g.active) {
      ctx.drawImage(guardImg,
        g.x + (g.width - guardW) / 2,
        g.y + (g.height - guardH) / 2,
        guardW, guardH);
    }
  });

  if (playerVisible) {
    ctx.drawImage(playerImg,
      player.x - playerSize / 2,
      player.y - playerSize / 2,
      playerSize, playerSize);
  }
}

/* ===== LOOP ===== */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
