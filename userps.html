<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Intro Login</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: url("assets/mini_bg.png") no-repeat center center / cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: dongle, sans-serif;
}

.login-wrapper {
    position: relative;
    width: 90vw;
    max-width: 1200px;
    transform: scale(1.3);
    transform-origin: center;
}

.panel {
    width: 100%;
    display: block;
}

/* -------------------------
   버튼 이미지
--------------------------*/
#user-img,
#psw-img,
#signup-img {
    width: 100%;
    pointer-events: none;
}

#user-img,
#psw-img {
    position: relative;
    z-index: 1;
}

/* USERNAME 활성 */
.username-active {
    transform: scale(2.5);
    transform-origin: center;
}

/* -------------------------
   INPUT 공통
--------------------------*/
.input-field {
    position: absolute;
    background: transparent;
    border: none;
    outline: none;

    font-family: dongle, sans-serif;
    font-size: 1.2vw;
    color: #ef8ec7;
    text-align: center;

    line-height: 0.9em;
    height: 0.9em;
    padding: 0;
    margin: 0;

    caret-color: #ef8ec7;
    pointer-events: auto;
    width: 30%;
    z-index: 1000;
}

.input-field:hover {
    cursor: text;
}

.user-name-div {
    width: 50%;
    position: absolute;
    top: 23%;
    left: 25%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.password-div {
    width: 50%;
    position: absolute;
    top: 26%;
    left: 25%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
}

.signup-div {
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 120%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
}

.signup-button {
    position: absolute;
    transform: translateY(120%);
    width: 8%;
    height: 4%;
    opacity: 0%;
    pointer-events: auto;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="login-wrapper">

    <img src="assets/loginpage.png" class="panel" id="login-panel">

    <div class="user-name-div">
        <img src="assets/usernamebutton.png" id="user-img">
        <input type="text" id="username" class="input-field" autocomplete="off">
    </div>

    <div class="password-div">
        <img src="assets/pswbutton.png" id="psw-img">
        <input type="password" id="password" class="input-field" autocomplete="off">
    </div>
    
    <div class="signup-div">
        <img src="assets/signupbutton.png" id="signup-img">
        <button class="signup-button" onclick="submitForm()"></button>
    </div>
</div>

<!-- ✅ BGM (20초부터 자동 재생 / Mac Local) -->
<audio
    id="bgm"
    src="assets/cute.mp3"
    autoplay
    loop
></audio>

<script>
/* ---------- BGM : START AT 20s ---------- */
const bgm = document.getElementById("bgm");

bgm.addEventListener("canplaythrough", () => {
    try {
        if (bgm.currentTime < 20) {
            bgm.currentTime = 20;
        }
        bgm.play();
    } catch (e) {}
}, { once: true });

/* ---------- FORM ---------- */
function submitForm() {
    const user = document.getElementById("username").value.trim();
    const pw = document.getElementById("password").value.trim();

    if (!user || !pw) {
        alert("아이디와 비밀번호를 입력해주세요.");
        return;
    }

    bgm.pause();
    location.href = "intro.html";
}

window.addEventListener("load", () => {
    const userImg = document.getElementById("user-img");
    const pwImg = document.getElementById("psw-img");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const panel = document.getElementById("login-panel");

    /* USERNAME */
    usernameInput.addEventListener("focus", () => {
        userImg.src = "assets/usernamebutton1.png";
        userImg.classList.add("username-active");
    });

    usernameInput.addEventListener("blur", () => {
        if (usernameInput.value.trim() === "") {
            userImg.src = "assets/usernamebutton.png";
            userImg.classList.remove("username-active");
        } else {
            userImg.src = "assets/usernamebutton1.png";
            userImg.classList.add("username-active");
        }
    });

    /* PASSWORD */
    passwordInput.addEventListener("focus", () => {
        pwImg.src = "assets/pswbutton1.png";
    });

    passwordInput.addEventListener("blur", () => {
        pwImg.src = "assets/pswbutton.png";
    });

    /* LOGIN PANEL FLICKER */
    let toggle = false;
    setInterval(() => {
        panel.src = toggle
            ? "assets/loginpage.png"
            : "assets/loginpage2.png";
        toggle = !toggle;
    }, 800);
});
</script>

</body>
</html>
