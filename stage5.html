<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Ending</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <video id="video" playsinline>
    <source src="ending.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById('video');

    window.addEventListener('load', async () => {
      try {
        await video.play();
      } catch (e) {
        // 브라우저가 소리 자동재생을 차단한 경우
        // 아무것도 하지 않음 (첫 프레임 유지)
      }
    });
  </script>

</body>
</html>
