<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <link rel="stylesheet" href="css/global.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url("assets/mini_bg.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #character {
            width: 1400px;
            height: auto;
            display: block;
        }

        #textBox {
            position: absolute;
            top: 47%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            transition: all 0.3s ease;
        }

        #textBox img {
            width: 1200px;
            height: auto;
        }

        #sparkle {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            pointer-events: none;
            z-index: 20;
            animation: sparkleBlink 1.4s infinite ease-in-out;
        }

        @keyframes sparkleBlink {
            0%   { opacity: 0; transform: translateX(-50%) scale(0.9); }
            50%  { opacity: 1; transform: translateX(-50%) scale(1.1); }
            100% { opacity: 0; transform: translateX(-50%) scale(0.9); }
        }
    </style>
</head>

<body>

<div id="container">
    <img id="sparkle" src="assets/sparkle.png" alt="sparkle">

    <div id="textBox">
        <img id="textImage" src="assets/text1.png" alt="text">
    </div>

    <img id="character" src="assets/heartcharacter.png" alt="character">
</div>

<!-- ✅ BGM : Mac Safari SAFE -->
<audio
    id="bgm"
    src="assets/cute.mp3"
    autoplay
    muted
    loop
></audio>

<script>
/* ---------- BGM (START AT 30s – SAFARI SAFE) ---------- */
const bgm = document.getElementById("bgm");

bgm.addEventListener("loadedmetadata", () => {
    bgm.currentTime = 30;

    // Safari needs a tiny delay before unmute
    setTimeout(() => {
        bgm.muted = false;
        bgm.volume = 1;
    }, 150);
});

/* ---------- TEXT FLOW ---------- */
const textImages = [
    "assets/text1.png",
    "assets/text2.png",
    "assets/text3.png"
];

const textTops = ["47%", "48%", "46.3%"];
const textLefts = ["50%", "52%", "50%"];

let currentIndex = 0;

const textBox = document.getElementById("textBox");
const textImage = document.getElementById("textImage");

function updateText(index) {
    textImage.src = textImages[index];
    textBox.style.top = textTops[index];
    textBox.style.left = textLefts[index];
}

document.body.addEventListener("click", () => {
    currentIndex++;

    if (currentIndex < textImages.length) {
        updateText(currentIndex);
    } else {
        bgm.pause();
        window.location.href = "stage2.html";
    }
});
</script>

</body>
</html>
