<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">

    <style>
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url("assets/mini_bg1.png") center / cover no-repeat;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #frame16x9 {
            width: 90vw;
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: visible;
        }

        .title-image {
            position: absolute;
            top: -30%;
            left: 25%;
            transform: translateX(-50%);
            width: 95%;
            pointer-events: none;
        }

        .intro-character {
            position: absolute;
            bottom: -60px;
            right: -270px;
            max-width: 90%;
            max-height: 110%;
            object-fit: contain;
            pointer-events: none;
        }

        .start-button {
            position: absolute;
            bottom: -35%;
            left: 20%;
            transform: translateX(-50%);
            width: 1500px;
            cursor: pointer;
            overflow: hidden;
            animation: shakeY 0.8s ease-in-out infinite;
        }

        @keyframes shakeY {
            0%   { transform: translateX(-50%) translateY(0); }
            25%  { transform: translateX(-50%) translateY(2px); }
            50%  { transform: translateX(-50%) translateY(0); }
            75%  { transform: translateX(-50%) translateY(-2px); }
            100% { transform: translateX(-50%) translateY(0); }
        }

        .bubble-heart {
            position: absolute;
            bottom: -60px;
            pointer-events: none;
            opacity: 0.7;
            animation-name: floatUp;
            animation-timing-function: linear;
        }

        @keyframes floatUp {
            from { transform: translateY(0); opacity: 0.7; }
            to   { transform: translateY(-120vh); opacity: 0; }
        }
    </style>
</head>

<body>

<div id="container">
    <div id="frame16x9">

        <img src="assets/title.png" class="title-image">

        <img
            src="assets/intro_character.png"
            class="intro-character"
            id="introCharacter"
        >

        <img
            src="assets/start_btn.png"
            class="start-button"
            onclick="startGame()"
        >

    </div>
</div>

<!-- ✅ AUTO PLAY BGM (Mac Local) -->
<audio
    id="bgm"
    src="assets/cute.mp3"
    autoplay
    loop
></audio>

<script>
    /* ---------- START ---------- */
    function startGame() {
        document.getElementById("bgm").pause();
        window.location.href = "stage1.html";
    }

    /* ---------- CHARACTER BLINK ---------- */
    const characterImages = [
        "assets/intro_character.png",
        "assets/characterclosing.png"
    ];

    let charIndex = 0;
    const characterImg = document.getElementById("introCharacter");

    setInterval(() => {
        charIndex = (charIndex + 1) % characterImages.length;
        characterImg.src = characterImages[charIndex];
    }, 500);

    /* ---------- BACKGROUND SWITCH ---------- */
    const bgImages = [
        "assets/mini_bg1.png",
        "assets/mini_bg2.png"
    ];

    let bgIndex = 0;
    const htmlEl = document.documentElement;

    setInterval(() => {
        bgIndex = (bgIndex + 1) % bgImages.length;
        htmlEl.style.backgroundImage = `url("${bgImages[bgIndex]}")`;
    }, 700);

    /* ---------- FLOATING HEARTS ---------- */
    const frame = document.getElementById("frame16x9");

    function createBubbleHeart() {
        const heart = document.createElement("img");
        heart.src = "assets/transparentheart.png";
        heart.className = "bubble-heart";

        const size = Math.random() * 80 + 60;
        heart.style.width = size + "px";
        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDuration = (Math.random() * 4 + 4) + "s";

        frame.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove());
    }

    setInterval(createBubbleHeart, 600);
</script>

</body>
</html>
