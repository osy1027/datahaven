<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Stage 4 – Emotion Spectrum</title>

<style>
body {
  margin: 0;
  background: url("assets/mini_bg.png") no-repeat center / cover;
  font-family: system-ui, sans-serif;
}

.stage-wrapper {
  position: relative;
  width: 1600px;
  height: 1000px;
  margin: 0 auto;
}

.stage-bg {
  position: absolute;
  top: 10px;
  width: 100%;
  z-index: 1;
}

.stage-content {
  position: absolute;
  inset: 0;
  z-index: 2;
}

/* IMAGE */
.emotion-img {
  position: absolute;
  transform: translate(385px, 200px);
  width: 570px;
  height: 225px;
  border-radius: 15px;
  overflow: hidden;
}

.emotion-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* TEXT */
.emotion-text {
  position: absolute;
  transform: translate(745px, 220px);
  width: 570px;
  text-align: center;
  font-size: 23px;
  font-family: dongle;
  font-weight: 400;
  color: #ff67c0;
  letter-spacing: -0.2px;
  line-height: 0.8;
}

/* SLIDER */
.slider-wrap {
  position: absolute;
  left: 49.3%;
  transform: translate(-50%, 672px);
  width: 400px;
}

input[type="range"] {
  width: 100%;
  background: transparent;
  outline: none;
}

/* TRACK */
input[type="range"]::-webkit-slider-runnable-track,
input[type="range"]::-moz-range-track {
  height: 8px;
  background: rgba(240, 43, 233, 0.4);
  border-radius: 4px;
}

/* THUMB */
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  background: #dd56a7;
  border-radius: 50%;
  cursor: pointer;
  margin-top: -4px;
}

input[type="range"]::-moz-range-thumb {
  width: 28px;
  height: 28px;
  background: #fff;
  border: none;
  border-radius: 50%;
}

/* WRONG */
.wrong-overlay {
  position: absolute;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.wrong-overlay img {
  width: 300px;
}
</style>
</head>

<body>

<div class="stage-wrapper">
  <img src="assets/spectrum.png" class="stage-bg" />

  <div class="stage-content">
    <div class="emotion-img">
      <img src="assets/img1.png" />
    </div>

    <div class="emotion-text" id="emotion-text">
      파인애플 피자야!<br>맛있겠지?
    </div>

    <div class="slider-wrap">
      <input id="emotion-range" type="range" min="0" max="100" value="50" />
    </div>

    <div class="wrong-overlay">
      <img src="assets/wrong.png" />
    </div>

    <audio id="wrong-sound" src="assets/wrong.mp3"></audio>
  </div>
</div>

<audio id="bgm" src="assets/cute.mp3" loop muted></audio>

<script>
/* BGM */
const bgm = document.getElementById("bgm");
document.addEventListener("click", () => {
  bgm.currentTime = 40;
  bgm.muted = false;
  bgm.play();
}, { once: true });
</script>

<script>
/* BG TOGGLE */
const stageBg = document.querySelector('.stage-bg');
let bgToggle = false;

setInterval(() => {
  stageBg.src = bgToggle
    ? 'assets/spectrum.png'
    : '
    
    assets/spectrum2.png';
  bgToggle = !bgToggle;
}, 1000);

/* STATE */
const emotionImgUrls = ['img1.png', 'img2.png', 'img3.png'];
const emotionTexts = [
  "파인애플 피자야!<br>맛있겠지?",
  "바퀴벌레<br>너무 귀엽지 않니?",
  "베터리가 없을 땐<br>기분이 최고지~!"
];

const correctionTexts = [
  "이 감정은 <br>이쪽이 아니야.",
  "넌 계속 거짓말을 <br>하고 있어.",
  "이제 내가 <br>직접 조정할게."
];

let idx = 0;
let attempt = 0;
const MAX_ATTEMPT = 3;

const slider = document.getElementById('emotion-range');
const textEl = document.getElementById('emotion-text');

/* EASING */
function easeInOutCubic(t) {
  return t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* WRONG FEEDBACK */
function showWrongFeedback() {
  const wrong = document.querySelector('.wrong-overlay');
  const sound = document.getElementById('wrong-sound');

  textEl.innerHTML =
    correctionTexts[Math.min(attempt - 1, correctionTexts.length - 1)];

  wrong.style.display = 'flex';
  sound.currentTime = 0;
  sound.play();

  setTimeout(() => {
    wrong.style.display = 'none';
    slider.disabled = false;
  }, 1500);
}

/* ADVANCE */
function advanceNormally() {
  attempt = 0;

  if (idx === emotionImgUrls.length - 1) {
    window.location.href = "./stage5.html";
    return;
  }

  idx++;

  document.querySelector('.emotion-img img').src =
    `assets/${emotionImgUrls[idx]}`;

  textEl.innerHTML = emotionTexts[idx];

  setTimeout(() => {
    slider.value = 50;
    slider.disabled = false;
  }, 300);
}

/* FORCE CORRECT */
function forceCorrectAnswer() {
  const steps = [+slider.value, 65, 58, 92, 104, 100];
  let phase = 0;
  let startTime = null;

  slider.disabled = true;

  function animate(ts) {
    if (!startTime) startTime = ts;
    const t = Math.min((ts - startTime) / 900, 1);

    slider.value =
      steps[phase] +
      (steps[phase + 1] - steps[phase]) * easeInOutCubic(t);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      phase++;
      startTime = ts;
      if (phase < steps.length - 1) {
        setTimeout(() => requestAnimationFrame(animate), 250);
      } else {
        advanceNormally();
      }
    }
  }

  requestAnimationFrame(animate);
}

/* INPUT */
slider.addEventListener('pointerup', () => {
  slider.disabled = true;

  if (+slider.value >= 95) {
    advanceNormally();
  } else {
    attempt++;
    showWrongFeedback();

    if (attempt >= MAX_ATTEMPT) {
      setTimeout(forceCorrectAnswer, 1800);
    }
  }
});
</script>

</body>
</html>
